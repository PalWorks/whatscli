name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.3.1"
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: whatscli
          - runs_on: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            binary: whatscli
          - runs_on: windows-latest
            goos: windows
            goarch: amd64
            binary: whatscli.exe
    steps:
      - name: Validate tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "Bad tag: $RELEASE_TAG"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.VERSION=${RELEASE_TAG}" -o "dist/${BINARY}" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: bin

      - name: Package
        run: |
          mkdir -p release-assets
          for d in linux-amd64 linux-arm64; do
            chmod +x "bin/bin-$d/whatscli"
            tar -C "bin/bin-$d" -czf "release-assets/whatscli-${RELEASE_TAG}-$d.tar.gz" whatscli
          done
          (cd bin/bin-windows-amd64 && zip -q "../../release-assets/whatscli-${RELEASE_TAG}-windows-amd64.zip" whatscli.exe)
          (cd release-assets && sha256sum * > "whatscli-${RELEASE_TAG}-checksums.txt" && cat "whatscli-${RELEASE_TAG}-checksums.txt")

      - name: Generate AUR PKGBUILDs (artifact only, not published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tarball exists once the tag exists; generated after packaging so a failure here is non-fatal
          bash .github/scripts/generate-aur-pkgbuilds.sh "$RELEASE_TAG" aur-out || echo "AUR generation skipped"

      - name: Release notes
        run: |
          prev="$(.github/scripts/previous-tag.sh "$RELEASE_TAG")"
          if [ -n "$prev" ]; then
            git log "$prev..$RELEASE_TAG" --no-decorate --pretty=format:'- %s' > notes.txt
          else
            git log "$RELEASE_TAG" --no-decorate --pretty=format:'- %s' > notes.txt
          fi
          [ -s notes.txt ] || echo "- Release $RELEASE_TAG" > notes.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            # Release candidates (tags with a '-') are pre-releases and never "Latest".
            flags=()
            case "$RELEASE_TAG" in *-*) flags=(--prerelease --latest=false) ;; esac
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG" --notes-file notes.txt "${flags[@]}"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: hashFiles('aur-out/**') != ''
        with:
          name: aur-pkgbuilds
          path: aur-out
