name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # go.mod has "toolchain go1.27.3"; with the default "auto" the 1.26 leg would
      # switch to 1.27.3 and never test 1.26. "local" keeps the toolchain setup-go installed.
      GOTOOLCHAIN: local
    strategy:
      matrix:
        go-version: ['1.26', '1.27']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Show Go version and check the matrix leg
        run: |
          go version
          go version | grep -q "go${{ matrix.go-version }}\." || { echo "Leg ${{ matrix.go-version }} is running a different Go"; exit 1; }

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Check SPDX licence headers
        run: .github/scripts/check-spdx.sh

      - name: Download Go modules
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race -count=1 ./...
